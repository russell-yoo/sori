[package]
name = "sori"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
yaml_serde = "0.10.7"
